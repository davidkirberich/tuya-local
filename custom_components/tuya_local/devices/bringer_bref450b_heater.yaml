name: Metal panel heater
products:
  - id: ccgrrti2rjpk7odg
    manufacturer: Bringer
    model: "BREF450-B"
entities:
  - entity: climate
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: "heat"
      - id: 2
        type: integer
        name: temperature
        range:
          min: 5
          max: 55
      - id: 6
        type: boolean
        name: preset_mode
        mapping:
          - dps_val: true
            value: eco
          - dps_val: false
            value: none
      - id: 11
        type: string
        name: hvac_action
        mapping:
          - dps_val: "heating"
            value: heating
          - dps_val: "idle"
            value: idle
          - dps_val: "standby"
            value: idle

  - entity: lock
    name: Child lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock

  - entity: light
    name: Display light
    category: config
    dps:
      - id: 10
        type: boolean
        name: switch

  - entity: select
    name: Timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: "cancel"
            value: "Off"
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"

  - entity: sensor
    name: Timer remaining
    category: diagnostic
    class: duration
    dps:
      - id: 20
        type: integer
        name: sensor
        unit: min
